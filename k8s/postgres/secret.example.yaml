# Phase A3 Task 2 — TEMPLATE សម្រាប់ Secret (commit file នេះ; secret.yaml ពិត gitignored — CLAUDE.md §4)
# ► ប្រើ: cp k8s/postgres/secret.example.yaml k8s/postgres/secret.yaml → កែ password → kubectl apply
# ► stringData: សរសេរអត្ថបទធម្មតា, K8s base64 ឱ្យ (data: ត្រូវ base64 ដោយដៃ)។ base64 ≠ encryption:
#   `kubectl get secret postgres-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d` អានបានដោយអ្នកណាមាន RBAC get secret
# ► សេណារីយ៉ូ Phase B: file នេះលើ laptop ក្រុម ៥ នាក់ចែកគ្នាយ៉ាងណា? → Sealed Secrets / External Secrets / Vault
# ► key ដដែល POSTGRES_PASSWORD ប្រើ ២ កន្លែង: postgres container (envFrom secretRef) និង app (secretKeyRef → SPRING_DATASOURCE_PASSWORD, Task 3)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: minishop
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
