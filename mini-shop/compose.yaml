services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: minishop
      POSTGRES_USER: minishop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minishop -d minishop"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    image: mini-shop:local
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/minishop
      SPRING_DATASOURCE_USERNAME: minishop
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
