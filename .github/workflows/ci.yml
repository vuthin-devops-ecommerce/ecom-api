# =====================================================================================
# Phase A2 — CI workflow
#   Task 1: build + unit test រាល់ push
#   Task 2: integration test (Testcontainers) ក្នុង job ដាច់ — run តែពេល unit test ឆ្លង (fail fast)
#
# របៀបអាន file នេះ: បន្ទាត់នីមួយៗមាន ៣ ផ្នែក
#   ► អ្វី       — បន្ទាត់នេះធ្វើអ្វី
#   ► សេណារីយ៉ូ  — កើតអ្វី "បើមាន" / "បើគ្មាន" បន្ទាត់នេះ (ស្រមៃមើលពិត)
#   ► សំណួរ      — សំណួរ review, ឆ្លើយក្នុង docs/journey/phase-a2/learning-log.md (Phase A2)
#
# គំនិតធំ: CI ជា feedback loop — រាល់ step សួរថា "បើ step នេះបរាជ័យ ខ្ញុំដឹងអ្វី? ក្នុងពេលប៉ុន្មាន?"
# ការសម្រេចចិត្តបំបែក job: docs/decisions/004-ci-job-structure.md
# =====================================================================================

name: CI   # ឈ្មោះដែលបង្ហាញក្នុង Actions tab និង badge (Task 5) — ប្តូរឈ្មោះ = badge URL ប្តូរ

# -------------------------------------------------------------------------------------
# on: — ព្រឹត្តិការណ៍ណាខ្លះធ្វើឱ្យ workflow run
# -------------------------------------------------------------------------------------
on:
  push:
    branches: ["**"]        # ► អ្វី: push ទៅ branch ណាក៏ run (រួមទាំង feature branch)
                            # ► សេណារីយ៉ូ: អ្នក push branch "fix-stock" → CI run ភ្លាម → ដឹងថាខូចមុនបើក PR
                            #   បើសរសេរ [main] ប៉ុណ្ណោះ → feature branch គ្មាន feedback រហូតដល់ merge (យឺតពេក)
  pull_request:
    branches: [main, develop]   # ► អ្វី: PR ដែលចង់ merge ចូល main ឬ develop ក៏ run ដែរ
                                # ► សេណារីយ៉ូ: Task 5 branch protection ត្រូវការ status check ពី PR run នេះ
                                # ► សំណួរ: push + pull_request ទាំង ២ → commit តែមួយ run ២ ដងឬ? ថ្លៃឬអត់?

# -------------------------------------------------------------------------------------
# concurrency: — កុំឱ្យ run ចាស់ និង run ថ្មីលើ branch ដដែល run ព្រមគ្នា
# -------------------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}   # ► អ្វី: ក្រុម = ឈ្មោះ workflow + branch (ឧ. "CI-refs/heads/develop")
  cancel-in-progress: true                           # ► អ្វី: run ថ្មីមក → run ចាស់ក្នុងក្រុមដដែលត្រូវ cancel
                                                     # ► សេណារីយ៉ូ: push ៣ ដងក្នុង ១ នាទី → run ១ និង ២ ត្រូវ cancel, តែ run ៣ (commit ចុងក្រោយ) run ចប់
                                                     #   បើគ្មាន: ៣ run ដើរព្រមគ្នា = លុយ runner ៣ ដង ហើយលទ្ធផល run ១-២ គ្មានប្រយោជន៍ (code ចាស់)
                                                     # ► សំណួរ: ហេតុអ្វី group ត្រូវមាន github.ref? បើដាក់តែ github.workflow កើតអ្វីពេល ២ នាក់ push ២ branch?

# -------------------------------------------------------------------------------------
# permissions: — least privilege សម្រាប់ GITHUB_TOKEN
# -------------------------------------------------------------------------------------
permissions:
  contents: read    # ► អ្វី: token របស់ run នេះអាន repo បានប៉ុណ្ណោះ — សរសេរមិនបាន
                    # ► សេណារីយ៉ូ: dependency ព្យាបាទ (malicious) ក្នុង test រត់ក្នុង CI ព្យាយាម push commit / បង្កើត release
                    #   → បរាជ័យ ព្រោះ token គ្មានសិទ្ធិ write។ បើគ្មានបន្ទាត់នេះ default អាចជា write ទាំងអស់ (អាស្រ័យ repo setting)
                    # ► សេណារីយ៉ូ Task 3: job docker ត្រូវការ packages: write → ប្រកាសនៅ job នោះតែម្តង មិនមែនទីនេះ
                    # ► សំណួរ: បើមិនកំណត់ default ជាអ្វី? (មើល Settings → Actions → Workflow permissions របស់ repo)

# -------------------------------------------------------------------------------------
# defaults: — app នៅក្នុង subfolder mini-shop/ មិនមែន root (monorepo, CLAUDE.md §1)
# -------------------------------------------------------------------------------------
defaults:
  run:
    working-directory: mini-shop   # ► អ្វី: រាល់ step "run:" ចាប់ផ្តើមនៅ mini-shop/ (ដូច cd mini-shop មុន)
                                   # ► សេណារីយ៉ូ: បើគ្មាន → ./mvnw រកមិនឃើញ ("No such file or directory") ព្រោះ runner នៅ root repo
                                   # ► ប្រយ័ត្ន: អនុវត្តលើ "run:" ប៉ុណ្ណោះ — step "uses:" (action) មិនស្គាល់ working-directory
                                   #   ដូច្នេះ path ដែលផ្តល់ឱ្យ action (cache-dependency-path, upload path) ត្រូវសរសេរ mini-shop/... ពី root
                                   # ► សំណួរ: បើ upload path សរសេរ target/surefire-reports/ (គ្មាន mini-shop/) កើតអ្វី? (hint: if-no-files-found)

jobs:
  # ===================================================================================
  # Job 1 — unit-test (លឿន: គ្មាន Docker, គ្មាន DB, ~20s ពេល cache hit)
  # ឈ្មោះ job "unit-test" នឹងក្លាយជា status check ក្នុង branch protection (Task 5) — កុំប្តូរឈ្មោះដោយមិនប្តូរ setting
  # ===================================================================================
  unit-test:
    runs-on: ubuntu-24.04   # ► អ្វី: VM Ubuntu 24.04 (pin version) — មិនមែន ubuntu-latest
                            # ► សេណារីយ៉ូ: GitHub ប្តូរ ubuntu-latest → 26.04 ថ្ងៃណាមួយ → tool version ក្នុង runner ប្តូរ → build ខូចដោយអ្នកមិនបានប៉ះអ្វី
                            #   ជាមួយ 24.04: build ខូចតែពេល "អ្នក" ប្តូរ — ដឹងមូលហេតុភ្លាម (ច្បាប់ដដែលនឹង postgres:17, CLAUDE.md §4)
    steps:
      # ---------------------------------------------------------------------------
      # Action pin ជា commit SHA + comment version
      # ► សេណារីយ៉ូ: tag "v7" អាចត្រូវ maintainer (ឬអ្នកលួច account) ផ្លាស់ទីទៅ commit ផ្សេង
      #   → workflow អ្នក run code ខុសពីម្សិលមិញដោយអ្នកមិនដឹង។ SHA ផ្លាស់ទីមិនបាន (immutable)
      # ► តម្លៃ: update ដោយដៃពិបាក → Dependabot (Task 5) ធ្វើជំនួស ដោយ update ទាំង SHA និង comment
      # ► សំណួរ: បើ comment "# v7.0.1" ខុសពី SHA ពិត អ្នកណាចាប់បាន? វាគ្រោះថ្នាក់យ៉ាងណា?
      # ---------------------------------------------------------------------------
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # ► អ្វី: clone commit ដែលធ្វើឱ្យ run នេះកើតឡើង ចូល runner (VM ទទេស្អាតរាល់ run)

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin          # ► អ្វី: Eclipse Temurin — vendor ដដែលនឹង laptop (README) និង Dockerfile (eclipse-temurin:21)
          java-version: "21"             # ► អ្វី: ដូច <java.version>21 ក្នុង pom.xml — "Reproducible": Java ដដែលគ្រប់ទីកន្លែង
          cache: maven                   # ► អ្វី: រក្សា ~/.m2/repository រវាង run (dependency ដែល download រួច)
                                         # ► សេណារីយ៉ូ (វាស់ពិត 2026-09-28): run ១ cache miss → build step 52s; run ២ cache hit → 17s
          cache-dependency-path: mini-shop/pom.xml   # ► អ្វី: cache key = hash នៃ file នេះ → កែ pom.xml = cache miss ១ ដង
                                                     # ► សំណួរ: ហេតុអ្វីមិន cache target/ (compiled class) ដែរ? វានឹងបង្កបញ្ហាអ្វី?

      - name: Unit test
        run: ./mvnw -B test
        # ► អ្វី: ./mvnw = Maven wrapper (3.9.16 pin) — Maven ដដែលនឹង laptop និង Dockerfile; -B = batch mode (log អានបាន)
        # ► "test" ជំនួស "verify -DskipITs" (Task 1): lifecycle ឈប់ត្រឹម phase test → surefire run *Test.java តែប៉ុណ្ណោះ
        #   failsafe ភ្ជាប់នឹង phase integration-test/verify ដែលមកក្រោយ → មិនដល់ → *IT.java មិន run ដោយស្វ័យប្រវត្តិ
        # ► សេណារីយ៉ូ: unit test ធ្លាក់ → job នេះក្រហម → job integration-test ខាងក្រោម "skipped" (needs) → សន្សំ ~1 នាទី + Docker
        # ► សំណួរ: Maven lifecycle: validate → compile → test → package → integration-test → verify. "test" ឈប់ត្រង់ណា? "verify" ធ្វើអ្វីបន្ថែម?

      - name: Upload unit test report
        if: always()   # ► អ្វី: run step នេះទោះ test ធ្លាក់ — បើគ្មាន report មិនដែល upload ពេលដែលអ្នកត្រូវការវាបំផុត
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: mini-shop/target/surefire-reports/     # ► path ពី root (action មិនស្គាល់ working-directory)
          if-no-files-found: warn

  # ===================================================================================
  # Job 2 — integration-test (យឺត: ត្រូវការ Docker + pull postgres:17 + boot Spring context)
  # ===================================================================================
  integration-test:
    needs: unit-test        # ► អ្វី: run តែពេល job unit-test ឆ្លង (fail fast — ច្បាប់ ១ ក្នុង phase-a2-plan)
                            # ► សេណារីយ៉ូ: បើគ្មាន needs → ២ job run ព្រមគ្នា: លឿនជាង (parallel) តែ unit ខូចក៏នៅតែចំណាយ Docker + DB ឥតប្រយោជន៍
                            # ► សំណួរ: parallel (គ្មាន needs) vs sequential (មាន needs) — មួយណាល្អសម្រាប់គម្រោងនេះ? (ADR-004)
    runs-on: ubuntu-24.04   # ► អ្វី: runner image នេះមាន Docker Engine ស្រាប់ → Testcontainers ប្រើបានដោយមិន setup អ្វី
                            # ► សេណារីយ៉ូ: runner គ្មាន Docker (ឧ. macOS runner ខ្លះ) → "Could not find a valid Docker environment" → IT ទាំងអស់ error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # ► សេណារីយ៉ូ: job នីមួយៗ = VM ថ្មី → ត្រូវ checkout ម្តងទៀត (តម្លៃនៃការបំបែក job ~5s)

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven                                 # ► សេណារីយ៉ូ: key ដដែលនឹង job unit-test → cache hit (unit-test save រួច) → មិន download ម្តងទៀត
          cache-dependency-path: mini-shop/pom.xml

      - name: Integration test (Testcontainers, postgres:17)
        run: ./mvnw -B verify -DskipUnitTests
        # ► អ្វី: "verify" ដល់ phase integration-test + verify → failsafe run *IT.java (OrderControllerIT)
        #   -DskipUnitTests → surefire មិន run unit test ម្តងទៀត (run រួចក្នុង job ១)
        # ► ប្រយ័ត្ន (ជួបពិត 2026-09-28): skipUnitTests មិនមែន property ដែល Maven ស្គាល់ដោយខ្លួនឯង —
        #   វាជា property ដែល "យើង" កំណត់ក្នុង pom.xml (<skipUnitTests>false</skipUnitTests> + surefire <skipTests>${skipUnitTests}</skipTests>)
        #   property ដែលមានស្រាប់: skipITs (failsafe ប៉ុណ្ណោះ), skipTests (ទាំង ២), maven.test.skip (មិន compile test ផង)
        #   សាក -Dsurefire.skip=true មុន → Maven មិនស្គាល់ → unit test run ២ ដងដោយស្ងាត់ (គ្មាន error!) → ត្រូវមើល log ថា "Tests run" ចេញពី plugin ណា
        # ► សេណារីយ៉ូ: OrderControllerIT boot Spring + Flyway migrate លើ postgres:17 ពិតក្នុង Docker → បញ្ជាក់ rollback ពិត (CLAUDE.md §5.7)
        #   ខុសពី services: postgres របស់ GitHub Actions — version pin នៅក្នុង test code (postgres:17) មិនមែនក្នុង YAML → laptop និង CI ដូចគ្នាទាំងស្រុង
        # ► សំណួរ: Testcontainers vs services: postgres — ហេតុអ្វីយើងជ្រើស Testcontainers? (learning-log Task 2)

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failsafe-reports                       # ► failsafe សរសេរ report ទៅ target/failsafe-reports/ (មិនមែន surefire-reports)
          path: mini-shop/target/failsafe-reports/
          if-no-files-found: warn

  # ===================================================================================
  # Job 3 — docker (Task 3): build image → push ទៅ ghcr.io — run តែពេល push ទៅ main
  # Image: ghcr.io/vuthin-devops-ecommerce/mini-shop:<short-sha> និង :latest (ឈ្មោះដូច phase-a3-plan ប្រើ)
  # ===================================================================================
  docker:
    needs: [unit-test, integration-test]   # ► អ្វី: build image តែពេល test ទាំង ២ job បៃតង
                                           # ► សេណារីយ៉ូ: IT ខូច → job នេះ skipped → registry មិនដែលមាន image ដែល test ធ្លាក់
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      # ► អ្វី: run តែពេល "push ទៅ main" — PR និង branch ផ្សេង (develop) មិន push image
      # ► សេណារីយ៉ូ: PR ពី fork/branch push image បាន → registry ពេញដោយ image ដែលមិនដែល release; អ្នកណាក៏ overwrite :latest បាន
      #   គ្មាន event_name == 'push' → pull_request ទៅ main ក៏ match github.ref? (មិនទេ — PR ref ជា refs/pull/N/merge — តែសរសេរច្បាស់ល្អជាង)
      # ► សំណួរ: main ទទួលបានតែពី merge PR (Task 5) — ដូច្នេះ "push ទៅ main" = "release" ។ ហេតុអ្វីនេះជាការរចនាដែលចង់បាន?
    runs-on: ubuntu-24.04
    permissions:
      contents: read      # ► checkout
      packages: write     # ► អ្វី: push ទៅ ghcr.io — ប្រកាសនៅ job នេះប៉ុណ្ណោះ (least privilege): job test ២ ខាងលើនៅតែ read-only
                          # ► សេណារីយ៉ូ: បើដាក់ packages: write នៅកម្រិត workflow → test ដែល run code ពី dependency ក៏មានសិទ្ធិ push image ដែរ
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        # ► អ្វី: BuildKit builder (driver docker-container) — ត្រូវការសម្រាប់ cache type=gha ខាងក្រោម
        # ► សេណារីយ៉ូ: បើគ្មាន → build-push-action ប្រើ docker driver ធម្មតា → "cache export is not supported for the docker driver"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}              # ► អ្នកដែល trigger run (username GitHub)
          password: ${{ secrets.GITHUB_TOKEN }}      # ► អ្វី: token ដែល GitHub បង្កើតរាល់ run, អស់សុពលភាពពេល run ចប់, សិទ្ធិតាម permissions: ខាងលើ
                                                     # ► សេណារីយ៉ូ: PAT (Personal Access Token) ជំនួស → ត្រូវបង្កើតដោយដៃ, រស់រហូតដល់លុប, ដាក់ក្នុង secret, rotate ខ្លួនឯង
                                                     #   បើលេចធ្លាយ = អ្នកលួចមានសិទ្ធិដូចអ្នក រហូត; GITHUB_TOKEN លេចធ្លាយ = ឥតប្រយោជន៍ក្រោយ run ចប់
                                                     # ► សំណួរ: ពេលណា GITHUB_TOKEN មិនគ្រប់គ្រាន់ ត្រូវការ PAT? (hint: push ទៅ repo/org ផ្សេង)

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta                                     # ► id ដើម្បី step ក្រោយយក outputs.tags / outputs.labels
        with:
          images: ghcr.io/${{ github.repository_owner }}/mini-shop   # ► ghcr.io/vuthin-devops-ecommerce/mini-shop (owner ត្រូវជាអក្សរតូច — ghcr តម្រូវ)
          # ► tags ខាងក្រោមជា YAML "block scalar" (|) — អ្វីៗក្នុងវាជា**អត្ថបទ** រួមទាំង "# ..." → មិនមែន comment ទេ!
          #   ជួបពិត 2026-09-28: ដាក់ comment ខ្មែរនៅចុងបន្ទាត់ក្នុង block → metadata-action យក comment ធ្វើជាផ្នែកនៃ tag →
          #   tag ក្លាយជា ":-tag-short-git-sha-7-.-dd44792-immutable-..." → buildx: "invalid reference format" → job ធ្លាក់ក្នុង 1s
          #   actionlint មិនចាប់ (វាមិនដឹង semantic របស់ input) — មានតែ run ពិត ឬអាន log "docker buildx build --tag ..." ទើបឃើញ
          #   line 1: type=sha,prefix=      → tag = short git sha (7 តួ) ឧ. :dd44792 — immutable: sha ១ = image ១ ជានិច្ច
          #   line 2: type=raw,value=latest → tag ចល័ត: ចង្អុលទៅ build ចុងក្រោយពី main
          tags: |
            type=sha,prefix=
            type=raw,value=latest
          # ► ជម្លោះដោយចេតនា: CLAUDE.md §4 "គ្មាន tag latest" — ច្បាប់នោះសម្រាប់ "ការប្រើ" (pull/deploy) image
          #   យើង "ផលិត" :latest តាមផែនការ Task 3 (DoD) តែ**មិនដែល deploy** វា — compose/K8s ប្រើ :<sha> ប៉ុណ្ណោះ (Task 3 លំហាត់, phase-a3)
          # ► សេណារីយ៉ូ: deploy :latest → rollback មិនបាន (latest ចាស់បាត់រួច), pod ២ ក្នុង cluster ដដែលអាច run image ខុសគ្នា ក្រោយ node pull ពេលខុសគ្នា
          # ► សំណួរ: ដូច្នេះ :latest មានប្រយោជន៍អ្វីខ្លះ? ឬគួរដកចេញទាំងស្រុងតាម CLAUDE.md? (សម្រេចក្នុង learning-log — អាចដកបានពេលអ្នកជ្រើស)
          # ► labels: metadata-action បន្ថែម OCI label (org.opencontainers.image.source=repo URL, revision=sha, created) ដោយស្វ័យប្រវត្តិ
          #   label source នេះធ្វើឱ្យ ghcr ភ្ជាប់ package ទៅ repo → visibility/permission តាម repo

      # ---------------------------------------------------------------------------
      # Task 4: លំដាប់ build → scan → push (scan "មុន" push — ADR-005)
      # ► សេណារីយ៉ូ: image មាន CRITICAL CVE → step scan ធ្លាក់ → step push មិនដល់ → registry គ្មាន image អាក្រក់
      #   ជម្រើសផ្ទុយ (scan ក្រោយ push): registry មាន image រួច ទោះ pipeline ក្រហម → អ្នកណាក៏ pull :latest បាន
      # ---------------------------------------------------------------------------
      - name: Build image (load to Docker daemon, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mini-shop              # ► monorepo: build context = folder app (Dockerfile COPY .mvn/, pom.xml, src/ ពីទីនេះ)
          file: mini-shop/Dockerfile      # ► path ពី root (action មិនស្គាល់ working-directory)
                                          # ► សេណារីយ៉ូ: context: . → Dockerfile រកមិនឃើញ pom.xml (វានៅ mini-shop/pom.xml) → "COPY failed"
          load: true                      # ► អ្វី: export image ចូល Docker daemon របស់ runner (ដើម្បី Trivy scan បាន) — មិន push
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha            # ► អ្វី: layer cache ក្នុង GitHub Actions cache (ដូច cache: maven តែសម្រាប់ Docker layer)
          cache-to: type=gha,mode=max     # ► mode=max: cache គ្រប់ layer រួមទាំង build stage (go-offline 24s) — វាស់ពិត: export 45s ក្នុង run ១
                                          # ► សេណារីយ៉ូ: run ២ កែតែ src/ → layer .mvn/pom/go-offline CACHED → សន្សំ ~24s; បើ export នៅតែ 45s រាល់ run → ពិចារណា mode=min
                                          # ► សំណួរ: cache: maven (setup-java) និង cache type=gha នេះ ជា cache ២ ផ្សេងគ្នា — ហេតុអ្វី Docker build មិនប្រើ ~/.m2 របស់ runner?

      - name: Scan image with Trivy (CRITICAL blocks)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # ► អ្វី: Trivy ស្កេន OS package (alpine apk) + Java dependency (jar ក្នុង app.jar) ធៀបនឹង CVE database
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/mini-shop:${{ steps.meta.outputs.version }}
                                          # ► outputs.version = tag ដែលមាន priority ខ្ពស់បំផុត: type=raw (200) > type=sha (100) → "latest"
                                          #   image ក្នុង daemon មាន tag ទាំង ២ (:<sha> និង :latest) ចង្អុលទៅ image ដដែល — scan មួយណាក៏ដូចគ្នា; មិនមែនពី registry
          format: table                   # ► អានបានក្នុង log; ជម្រើសផ្សេង: sarif → GitHub Security tab (ត្រូវការ security-events: write)
          exit-code: "1"                  # ► អ្វី: រកឃើញ CVE ត្រូវលក្ខខណ្ឌ → step ធ្លាក់ → job ក្រហម → step push មិនដល់
                                          # ► សេណារីយ៉ូ: exit-code "0" = "report only" — pipeline បៃតងជានិច្ច, គ្មាននរណាអាន → គ្មានប្រយោជន៍
          severity: CRITICAL              # ► ADR-005: ចាប់ផ្តើមតឹងតែលើ CRITICAL; HIGH ជា report មិនទាន់ block (step បន្ទាប់)
                                          # ► សេណារីយ៉ូ: CRITICAL,HIGH ពីដំបូង → base image ថ្មីៗក៏អាចមាន HIGH → pipeline ក្រហមញឹក → មនុស្សចាប់ផ្តើមមិនអើពើ
          ignore-unfixed: true            # ► អ្វី: មិនរាប់ CVE ដែល upstream មិនទាន់មាន fix (គ្មាន version ថ្មីឱ្យ upgrade)
                                          # ► សេណារីយ៉ូ: false → CVE ដែលអ្នកធ្វើអ្វីមិនបាន block release រហូតដល់ Alpine/Temurin ចេញ patch
                                          # ► សំណួរ: "ignore" មានន័យថា CVE នោះមិនគ្រោះថ្នាក់ឬ? អ្នកគួរតាមដានវាដោយរបៀបណា?

      - name: Trivy report HIGH (report only, never fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/mini-shop:${{ steps.meta.outputs.version }}
          format: table
          exit-code: "0"                  # ► report ប៉ុណ្ណោះ — ឃើញចំនួន HIGH ក្នុង log ដើម្បីសម្រេចថាពេលណាតឹងទៅ CRITICAL,HIGH (ADR-005 review)
          severity: HIGH
          ignore-unfixed: true
          skip-setup-trivy: true          # ► Trivy binary តម្លើងរួចពី step មុន — មិន download ម្តងទៀត
        # ► លំហាត់ Task 4: ប្តូរ base image ទៅ eclipse-temurin:17-jre (គ្មាន alpine) → CVE ខុសគ្នាប៉ុន្មាន? កត់ក្នុង tracker

      - name: Push image (only after scan passed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build                         # ► id ដើម្បី step summary យក outputs.digest
        with:
          context: mini-shop
          file: mini-shop/Dockerfile
          push: true                      # ► build ម្តងទៀត? ទេ — layer ទាំងអស់ CACHED ក្នុង builder ដដែល (~វិនាទី) → push ប៉ុណ្ណោះ
                                          # ► សេណារីយ៉ូ: step scan ធ្លាក់ → step នេះមិន run (default: step run តែពេល step មុនទាំងអស់ success)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Image summary
        run: |
          {
            echo "### Image pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
        # ► អ្វី: សរសេរ tag ទៅ Summary page របស់ run → ចម្លង :<sha> ទៅ compose/K8s បានដោយមិនរក log
        working-directory: .   # ► override defaults (mini-shop) — step នេះមិនត្រូវការ folder app

# =====================================================================================
# សំណួរ review សរុប (ឆ្លើយក្នុង docs/journey/phase-a2/learning-log.md)
#   1. Workflow នេះ run លើ commit ដែលកែតែ docs/*.md ដែរ — ខ្ជះខ្ជាយ ~1 នាទី។ គួរបន្ថែម on.push.paths ឬអត់?
#      hint: Task 5 "Require status checks" — បើ workflow មិន run, check មិន report → PR docs-only merge មិនបាន
#   2. បើ CI បៃតង តែ app crash ពេល run ពិត — workflow នេះខ្វះអ្វី? (Task 3 build image ដោះស្រាយផ្នែកមួយ)
#   3. Job integration-test compile code ម្តងទៀត (VM ថ្មី) — ចំណាយប៉ុន្មានវិនាទី? ជម្រើសជៀសវាង (upload target/ ជា artifact) សមឬអត់?
# =====================================================================================
